<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A chain of signed mandates from human to agent to merchant, stopped by a five thousand rupee cap">
<rect width="1200" height="675" fill="#F5F3EB"/>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1A3E2A"/></marker></defs>
<text x="80" y="92" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="3" fill="#A9613C">THE SIGNED CHAIN</text>
<g>
<circle cx="170" cy="230" r="62" fill="none" stroke="#1A3E2A" stroke-width="2.5"/>
<text x="170" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1A3E2A">Intent</text>
<text x="170" y="250" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1A3E2A" opacity=".7">the human</text>
<line x1="232" y1="230" x2="308" y2="230" stroke="#1A3E2A" stroke-width="2.5" marker-end="url(#f)"/>
<circle cx="370" cy="230" r="62" fill="none" stroke="#1A3E2A" stroke-width="2.5"/>
<text x="370" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1A3E2A">Cart</text>
<text x="370" y="250" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#1A3E2A" opacity=".7">the agent</text>
<line x1="432" y1="230" x2="508" y2="230" stroke="#1A3E2A" stroke-width="2.5" marker-end="url(#f)"/>
<circle cx="570" cy="230" r="62" fill="#1A3E2A"/>
<text x="570" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#F5F3EB">Payment</text>
<text x="570" y="250" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#F5F3EB" opacity=".8">the network</text>
</g>
<text x="80" y="336" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2" fill="#1A3E2A" opacity=".7">VISA · MASTERCARD · GOOGLE AP2 · STRIPE</text>
<line x1="80" y1="386" x2="1120" y2="386" stroke="#1A3E2A" stroke-width="1" opacity=".25"/>
<rect x="80" y="428" width="470" height="150" rx="4" fill="none" stroke="#A9613C" stroke-width="2.5"/>
<text x="108" y="476" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2" fill="#A9613C">THE CAP THAT STOPS IT</text>
<text x="108" y="526" font-family="Georgia, serif" font-size="44" fill="#A9613C">₹5,000</text>
<text x="108" y="558" font-family="Georgia, serif" font-size="19" fill="#A9613C">per delegated transaction</text>
<rect x="610" y="428" width="510" height="150" rx="4" fill="none" stroke="#1A3E2A" stroke-width="1.5" opacity=".55"/>
<text x="638" y="476" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2" fill="#1A3E2A" opacity=".75">A RETREAT BOOKING</text>
<text x="638" y="526" font-family="Georgia, serif" font-size="44" fill="#1A3E2A">₹18,000+</text>
<text x="638" y="558" font-family="Georgia, serif" font-size="19" fill="#1A3E2A" opacity=".8">four to twenty-four times the cap</text>
</svg>
